name: Rebuild global neighbours

on:
  push:
    branches:
      - main
    paths:
      - "submissions/**"
      - "founding/**"
      - "global/build.json"
      - "opted-out/**"
      - "banned/**"
      - "global_build.py"
      - "rules.py"
      - "share_submission.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild the global list
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Rebuild from the latest submissions
        run: |
          python3 global_build.py \
            --repo . \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --source-commit "${{ github.sha }}"

      - name: Commit the global list
        run: |
          if git diff --quiet -- global/neighbours.global.neighbours; then
            echo "Global list already matches this commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global/neighbours.global.neighbours
          git commit -m "Rebuild the global neighbours list"
          git push
